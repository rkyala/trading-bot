# Log rotation configuration for trading bot
# Usage: logrotate /Users/ramayalala/trading_bot/logrotate_trading_bot.conf

/Users/ramayalala/trading_bot/bot_cycle.log
/Users/ramayalala/trading_bot/signal_channel.log
/Users/ramayalala/trading_bot/bot_production.log
{
    # Rotate daily
    daily

    # Keep 7-day rolling history
    rotate 7

    # Compress old logs
    compress

    # Delete empty log files
    delaycompress

    # Don't error if log file is missing
    missingok

    # Don't rotate if file hasn't changed
    notifempty

    # Create new log file with same permissions
    create 0644 $(whoami) staff
}
